name: Microsite sync

# The microsite restates facts that live in TypeScript, and nothing in the
# build fails when one of them moves — this workflow is what fails instead.
# It runs the one suite that compares the page against the code.
on:
  push:
    branches: [main]
    paths:
      - "microsite/**"
      - "src/tests/microsite-sync.unit.test.ts"
      - "src/content/**"
      - "src/shared/**"
      - "popup/**"
      - "manifest.json"
      - "vitest.config.ts"
  pull_request:
    paths:
      - "microsite/**"
      - "src/tests/microsite-sync.unit.test.ts"
      - "src/content/**"
      - "src/shared/**"
      - "popup/**"
      - "manifest.json"
      - "vitest.config.ts"

# The paths are deliberately directories, not a file-by-file list. A hand-kept
# list looked complete and was not: the suite reaches comparer.ts, tax-date.ts,
# debug.ts and browser-shim.ts through transitive imports, and none of those
# were on it — so editing tax-date.ts would have changed a date format the
# page documents without waking this job up. Globs cannot rot that way.

# A new push makes an in-flight run for the same ref obsolete.
concurrency:
  group: microsite-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 12 is required: pnpm-workspace.yaml uses `allowBuilds`, which
      # earlier versions do not understand, and esbuild's build script then
      # trips ERR_PNPM_IGNORED_BUILDS during install.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Microsite may not drift from the code
        run: pnpm exec vitest --run src/tests/microsite-sync.unit.test.ts